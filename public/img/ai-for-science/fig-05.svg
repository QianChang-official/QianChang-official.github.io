<svg width="760" height="404" viewBox="0 0 760 404" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 5｜分数随配置与预算移动，所以读数字要先读条件">
<rect width="760" height="404" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 5｜分数不是裸能力：同一把尺子，换个条件就换个数</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >三张图看的是同一件事——结果随配置与预算移动，所以读数字要先读条件。</text><text x="16" y="76" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >ScienceAgentBench（102 项 / 44 篇 / 4 学科 / 各 3 次）</text><rect x="150" y="88" width="145.9" height="16" rx="2" fill="#c9c3b8"/><text x="142" y="100" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >最佳 Agent</text><text x="303.8767772511848" y="100" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >32.4%</text><rect x="150" y="118" width="154.4" height="16" rx="2" fill="#c9c3b8"/><text x="142" y="130" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >+专家知识</text><text x="312.43127962085305" y="130" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >34.3%</text><rect x="150" y="148" width="190.0" height="16" rx="2" fill="#8a5a2b"/><text x="142" y="160" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >o1+self-debug</text><text x="348.0" y="160" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >42.2%</text><text x="384.0" y="160" font-size="10.5" fill="#a8422f" text-anchor="start" font-weight="400" >成本 >10×</text><text x="16" y="196" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >CORE-Bench（270 项 / 90 篇 / 计算复现）</text><rect x="150" y="208" width="190.0" height="16" rx="2" fill="#c9c3b8"/><text x="142" y="220" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >Easy</text><text x="348.0" y="220" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >60.0%</text><rect x="150" y="238" width="183.0" height="16" rx="2" fill="#c9c3b8"/><text x="142" y="250" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >Medium</text><text x="341.0333333333333" y="250" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >57.8%</text><rect x="150" y="268" width="68.1" height="16" rx="2" fill="#8a5a2b"/><text x="142" y="280" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >Hard</text><text x="226.08333333333331" y="280" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >21.5%</text><rect x="150" y="298" width="21.2" height="16" rx="2" fill="#c9c3b8"/><text x="142" y="310" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >Hard·AutoGPT</text><text x="179.21666666666667" y="310" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >6.7%</text><text x="16" y="346" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >MLE-bench（75 个 Kaggle 竞赛）</text><rect x="150" y="358" width="94.2" height="16" rx="2" fill="#c9c3b8"/><text x="142" y="370" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >pass@1</text><text x="252.1642228739003" y="370" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >16.9%</text><rect x="150" y="388" width="190.0" height="16" rx="2" fill="#8a5a2b"/><text x="142" y="400" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >pass@8</text><text x="348.0" y="400" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="600" >34.1%</text><text x="384.0" y="400" font-size="10.5" fill="#a8422f" text-anchor="start" font-weight="400" >预算×8</text><rect x="470" y="76" width="280" height="300" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="486" y="100" font-size="12" fill="#8a5a2b" text-anchor="start" font-weight="700" >图要说的那一句</text><text x="486" y="126" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >同一个模型，换一个 scaffold，分数会变；</text><text x="486" y="148" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >多给几次重试，分数会变；</text><text x="486" y="170" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >给专家知识，分数会变；</text><text x="486" y="192" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >把推理预算加大，分数也会变。</text><text x="486" y="214" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="400" ></text><text x="486" y="236" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="400" >所以一个 benchmark 数字，</text><text x="486" y="258" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >是一个五元组：</text><text x="486" y="280" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >（任务，配置，预算，重试，评估器）</text><text x="486" y="302" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" ></text><text x="486" y="324" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >缺任何一项，这个数字都不可比。</text>
</svg>
