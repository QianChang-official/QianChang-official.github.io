<svg width="760" height="414" viewBox="0 0 760 414" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 11｜全文总图，以及定义从 v1 到 v2 的那一步">
<rect width="760" height="414" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 11｜全文最后留下的那张图</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >四问是知识生产链；外面那一圈不是第五步，是这条链能不能被启动的边界。</text><rect x="120" y="64" width="520" height="196" rx="6" fill="#fff" stroke="#8a5a2b"/><text x="132" y="84" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >责任位置与制度边界</text><rect x="140" y="84" width="480" height="30" rx="4" fill="#f6f4f0" stroke="#dcd8d1"/><text x="152" y="104" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >能不能做？</text><text x="300" y="104" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >第 5–12 章：软件、身体、能力、成本</text><rect x="140" y="122" width="480" height="30" rx="4" fill="#fff" stroke="#dcd8d1"/><text x="152" y="142" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >做出来算不算数？</text><text x="300" y="142" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >第 14 章：对象、证据、新颖性、公共检验</text><rect x="140" y="160" width="480" height="30" rx="4" fill="#f6f4f0" stroke="#dcd8d1"/><text x="152" y="180" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >凭什么相信？</text><text x="300" y="180" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >第 15 章：验证的分辨率、四种来源、三个出口</text><rect x="140" y="198" width="480" height="30" rx="4" fill="#fff" stroke="#dcd8d1"/><text x="152" y="218" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >下一次还成不成立？</text><text x="300" y="218" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >第 16–17 章：经验的资格、迁移的资格</text><text x="120" y="282" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >最终评价原则</text><rect x="210" y="266" width="130" height="24" rx="12" fill="#fbf7f2" stroke="#8a5a2b"/><text x="275" y="283" font-size="12" fill="#8a5a2b" text-anchor="middle" font-weight="700" >可追溯</text><rect x="360" y="266" width="130" height="24" rx="12" fill="#fbf7f2" stroke="#8a5a2b"/><text x="425" y="283" font-size="12" fill="#8a5a2b" text-anchor="middle" font-weight="700" >可检验</text><rect x="510" y="266" width="130" height="24" rx="12" fill="#fbf7f2" stroke="#8a5a2b"/><text x="575" y="283" font-size="12" fill="#8a5a2b" text-anchor="middle" font-weight="700" >可迁移</text><line x1="16" y1="316" x2="744" y2="316" stroke="#dcd8d1"/><text x="16" y="340" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="700" >定义 v1（第 0 章）</text><text x="16" y="360" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >让 AI 成为科学研究过程的</text><text x="16" y="378" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >一部分。</text><text x="173" y="360" font-size="16" fill="#8a5a2b" text-anchor="middle" font-weight="700" >→</text><text x="200" y="340" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >定义 v2（第 18 章）</text><text x="200" y="360" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >在多大程度上参与可靠科学知识的产生，</text><text x="200" y="378" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >并说清：凭什么成立、怎样被检验、</text><text x="200" y="396" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >凭什么在新条件下继续成立。</text>
</svg>
