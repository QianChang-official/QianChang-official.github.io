<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 9｜四道门之后只拿到候选；验证做完只有三个出口">
<rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 9｜从预测到候选，再到三个出口</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >左边四道门决定“能不能叫发现”；右边三个出口决定“这次验证算出了什么”。</text><rect x="16" y="70" width="112" height="92" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="26" y="92" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >一 · 对象</text><text x="26" y="116" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >你预测了什么，</text><text x="26" y="133" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >又声称发现了什么？</text><rect x="142" y="70" width="112" height="92" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="152" y="92" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >二 · 证据</text><text x="152" y="116" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >这个“对”，</text><text x="152" y="133" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >能支持什么主张？</text><rect x="268" y="70" width="112" height="92" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="278" y="92" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >三 · 新颖性</text><text x="278" y="116" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >它相对于谁</text><text x="278" y="133" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >是新的？</text><rect x="394" y="70" width="112" height="92" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="404" y="92" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >四 · 公共检验</text><text x="404" y="116" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >除产生它的人，</text><text x="404" y="133" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >还有谁能接？</text><line x1="130" y1="116" x2="140" y2="116" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="256" y1="116" x2="266" y2="116" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="382" y1="116" x2="392" y2="116" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="530" y="70" width="214" height="92" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="544" y="92" font-size="12" fill="#8a5a2b" text-anchor="start" font-weight="700" >Discovery 候选</text><text x="544" y="116" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >四道门全过，只拿到候选。</text><text x="544" y="134" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="400" >审议还没有发生。</text><line x1="520" y1="170" x2="520" y2="196" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><text x="0" y="196" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >第 15 章：一次验证做完，进入下一轮决策时归并为三个出口</text><rect x="16" y="210" width="232" height="84" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="28" y="232" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >支持</text><text x="28" y="252" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >维持相应强度，但要说明</text><text x="28" y="268" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >通过了哪些验证、</text><text x="28" y="284" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >哪些替代解释仍未被排除</text><rect x="262" y="210" width="232" height="84" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="274" y="232" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >推翻</text><text x="274" y="252" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >不是失败：它排除了一条</text><text x="274" y="268" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >原本仍在占用搜索与</text><text x="274" y="284" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >验证资源的路线</text><rect x="508" y="210" width="232" height="84" rx="6" fill="#fff" stroke="#8a5a2b"/><text x="520" y="232" font-size="12" fill="#8a5a2b" text-anchor="start" font-weight="700" >无法定论</text><text x="520" y="252" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >不是成功也不是失败，</text><text x="520" y="268" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >是证据不足以支持</text><text x="520" y="284" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >二元判断</text><text x="0" y="316" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >只能输出“成立/不成立”的流程，会把“仍不确定”挤进另外两个位置——所以第三种必须是合法状态。</text>
</svg>
