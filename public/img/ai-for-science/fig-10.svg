<svg width="760" height="286" viewBox="0 0 760 286" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 10｜从记住到迁移：前两格是存取，后四格是资格">
<rect width="760" height="286" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 10｜记住 → 取回 → 改变行动 → 判断还成不成立</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >前两格是存取问题，后四格是资格问题。前两格做得再好，也推不出后四格。</text><rect x="12" y="66" width="112" height="56" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="22" y="88" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >Storage</text><text x="22" y="108" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >过去还在不在</text><rect x="138" y="66" width="112" height="56" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="148" y="88" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >Retrieval</text><text x="148" y="108" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >有没有回来</text><rect x="264" y="66" width="112" height="56" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="274" y="88" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >Utilization</text><text x="274" y="108" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >有没有改变行动</text><rect x="390" y="66" width="112" height="56" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="400" y="88" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >Match</text><text x="400" y="108" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >共享哪些条件</text><rect x="516" y="66" width="112" height="56" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="526" y="88" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >Invalidate</text><text x="526" y="108" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >哪些前提变了</text><rect x="642" y="66" width="112" height="56" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="652" y="88" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >Act</text><text x="652" y="108" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >复用/降级/验证/停用</text><line x1="126" y1="94" x2="136" y2="94" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="252" y1="94" x2="262" y2="94" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="378" y1="94" x2="388" y2="94" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="504" y1="94" x2="514" y2="94" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="630" y1="94" x2="640" y2="94" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="16" y="146" width="348" height="96" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="30" y="168" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >数据说：巩固可能让记忆变坏</text><text x="30" y="190" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >原本无记忆能解出的题，持续巩固后有</text><text x="30" y="210" font-size="15" fill="#a8422f" text-anchor="start" font-weight="700" >54% 失败</text><text x="120" y="210" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >（仅该作者实验设置）</text><text x="30" y="230" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >只保留原始情景、不做巩固的对照组仍有竞争力。</text><rect x="396" y="146" width="348" height="96" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="410" y="168" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >数据说：任务做成 ≠ 记得住</text><rect x="410" y="182" width="290" height="10" rx="2" fill="#e9e5de"/><rect x="410" y="182" width="285" height="10" rx="2" fill="#8a5a2b"/><text x="410" y="206" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >任务完成度：接近饱和（连无记忆基线也是）</text><rect x="410" y="216" width="290" height="10" rx="2" fill="#e9e5de"/><rect x="410" y="216" width="174" height="10" rx="2" fill="#a8422f"/><text x="410" y="240" font-size="10.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >记忆可恢复率：约 0.6，且随 top-k 下降</text><text x="0" y="268" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" >所以三条判据：有可追溯的来源路径 · 带着条件 · 改变了行动（不是改变了叙述）。</text>
</svg>
