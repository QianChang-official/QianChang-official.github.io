<svg width="760" height="292" viewBox="0 0 760 292" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 8｜能力成本 ≠ 资产价格：钱花在六个地方">
<rect width="760" height="292" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 8｜一格能力的钱，花在六个地方</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >这不是资产清单，是成本边界：哪些支出必须被算进来。</text><rect x="16" y="70" width="96" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="64" y="92" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" >建立</text><text x="126" y="92" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >资产 / 环境 / 接入 / 初始验证</text><rect x="16" y="114" width="96" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="64" y="136" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" >持有</text><text x="126" y="136" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >人员 / 维护 / 校准与再验证 / 合规</text><rect x="16" y="158" width="96" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="64" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" >使用</text><text x="126" y="180" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >耗材 / 算力机时 / 样品物流 / 边际验证</text><rect x="16" y="202" width="96" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="64" y="224" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700" >重建</text><text x="126" y="224" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >升级 / 迁移 / 再认证</text><path d="M 470 66 L 470 250" stroke="#dcd8d1" stroke-width="1"/><text x="486" y="92" font-size="13" fill="#8a5a2b" text-anchor="start" font-weight="700" >Capability Cost</text><text x="486" y="112" font-size="13" fill="#8a5a2b" text-anchor="start" font-weight="700" >≠ Asset Price</text><text x="486" y="138" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >采购价只覆盖第一格的一小部分；</text><text x="486" y="158" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >接入、初始验证、再验证、</text><text x="486" y="178" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >边际验证、再认证——</text><text x="486" y="198" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >在资产清单里根本不出现。</text><text x="486" y="228" font-size="11.5" fill="#a8422f" text-anchor="start" font-weight="400" >砍掉它们，能力就从“经过验收”</text><text x="486" y="248" font-size="11.5" fill="#a8422f" text-anchor="start" font-weight="400" >退回“买了设备”。</text><text x="0" y="274" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >三个口径（建成 / 持有 / 使用）始终并列，不折现成一个总价——换一个利用率假设，总价就变了。</text>
</svg>
