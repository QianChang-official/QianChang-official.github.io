<svg width="760" height="348" viewBox="0 0 760 348" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 7｜不是越盖越大，是越长越远；三种长法各自的验收">
<rect width="760" height="348" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 7｜它不是越盖越大，是越长越远</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >第一阶段只有一栋楼；后面每一步加的不是面积，是一类新的约束。</text><rect x="20" y="70" width="224" height="86" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="34" y="94" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >一栋楼</text><text x="34" y="116" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >受控区、压差、分区</text><text x="34" y="134" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >一条走廊能走完</text><rect x="266" y="70" width="224" height="86" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="280" y="94" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >一个园区 / 一座城</text><text x="280" y="116" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >节点间物流、多套公用</text><text x="280" y="134" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >工程、属地治理</text><rect x="512" y="70" width="224" height="86" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="526" y="94" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >分布式节点</text><text x="526" y="116" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >跨区域、跨法域</text><text x="526" y="134" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >延迟开始变成约束</text><line x1="246" y1="113" x2="264" y2="113" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="492" y1="113" x2="510" y2="113" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><text x="0" y="186" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >三种长法（第 11 章）</text><rect x="0" y="200" width="130" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="14" y="222" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >学会</text><text x="146" y="222" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >新领域、新方法、新模型、新软件</text><text x="470" y="222" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >买得到知识，买不到判据</text><rect x="0" y="246" width="130" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="14" y="268" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >长身体</text><text x="146" y="268" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >新仪器、新实验空间、外部设施</text><text x="470" y="268" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >接得上，才叫进来了</text><rect x="0" y="292" width="130" height="34" rx="6" fill="#f6f4f0" stroke="#dcd8d1"/><text x="14" y="314" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700" >造自己</text><text x="146" y="314" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >缺的工具本身成为研究课题</text><text x="470" y="314" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400" >会造 ≠ 会证明它可靠</text>
</svg>
