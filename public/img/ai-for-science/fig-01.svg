<svg width="760" height="282" viewBox="0 0 760 282" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 1｜通用闭环，和一个材料实例">
<rect width="760" height="282" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 1｜通用闭环，和一个材料实例</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >上排是抽掉对象后的结构；下排是它在材料发现里的具体形状。两排的回边是同一个动作。</text><text x="22" y="72" font-size="11.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >AI4S 通用闭环</text><rect x="22" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="65.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >问题/目标</text><rect x="127" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="170.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >已有知识</text><rect x="232" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="275.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >产生下一步</text><rect x="337" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="380.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >选择并执行</text><rect x="442" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="485.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >获得证据</text><rect x="547" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="590.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >解释与评价</text><rect x="652" y="82" width="86" height="40" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="695.0" y="106" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >更新判断</text><line x1="110" y1="102" x2="125" y2="102" stroke="#8a5a2b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="215" y1="102" x2="230" y2="102" stroke="#8a5a2b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="320" y1="102" x2="335" y2="102" stroke="#8a5a2b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="425" y1="102" x2="440" y2="102" stroke="#8a5a2b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="530" y1="102" x2="545" y2="102" stroke="#8a5a2b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="635" y1="102" x2="650" y2="102" stroke="#8a5a2b" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 695.0 122 L 695.0 134 L 65.0 134 L 65.0 128" fill="none" stroke="#8a5a2b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah2)"/><text x="22" y="154" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="700" >材料发现中的一个实例</text><rect x="22" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="65.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >目标材料</text><rect x="127" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="170.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >文献/数据库</text><rect x="232" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="275.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >候选生成</text><rect x="337" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="380.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >计算筛选</text><rect x="442" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="485.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >实验选择</text><rect x="547" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="590.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >合成与表征</text><rect x="652" y="164" width="86" height="40" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="695.0" y="188" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >证据判断</text><line x1="110" y1="184" x2="125" y2="184" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="215" y1="184" x2="230" y2="184" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="320" y1="184" x2="335" y2="184" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="425" y1="184" x2="440" y2="184" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="530" y1="184" x2="545" y2="184" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="635" y1="184" x2="650" y2="184" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><path d="M 695.0 204 L 695.0 216 L 65.0 216 L 65.0 210" fill="none" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah)"/><text x="22" y="240" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >具体步骤因学科而变；目标 → 行动 → 证据 → 更新，这个结构不变。</text><text x="22" y="262" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >闭环成立 ≠ 知识成立：回边里若没有证据与判据，闭环只是在重复。</text>
</svg>
