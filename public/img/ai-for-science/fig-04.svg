<svg width="760" height="276" viewBox="0 0 760 276" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 4｜A-Lab 的完整证据生命周期：报告 → 质疑 → 更正">
<rect width="760" height="276" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 4｜A-Lab：一条完整的证据生命周期</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >同一份报告，三年后要重新读一遍：证据被校准。</text><rect x="16" y="68" width="232" height="116" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="30" y="90" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >2023 原始报告</text><text x="30" y="112" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >58 个目标</text><text x="30" y="130" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >41 种新化合物</text><text x="30" y="148" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >17 天自主运行</text><rect x="268" y="68" width="232" height="116" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="282" y="90" font-size="12.5" fill="#1a1a1a" text-anchor="start" font-weight="700" >2024 独立质疑</text><text x="282" y="112" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >外部研究者提出</text><text x="282" y="130" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >物相鉴定与新颖性</text><text x="282" y="148" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >的公开质疑</text><rect x="520" y="68" width="232" height="116" rx="6" fill="#fbf7f2" stroke="#8a5a2b"/><text x="534" y="90" font-size="12.5" fill="#8a5a2b" text-anchor="start" font-weight="700" >2026 Nature 更正</text><text x="534" y="112" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >57 个目标</text><text x="534" y="130" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >40 项成功 → 36 确认</text><text x="534" y="148" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >4 项仅凭 XRD 无法定论</text><text x="534" y="166" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >1 项误入训练数据被移除</text><line x1="250" y1="126" x2="266" y2="126" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><line x1="502" y1="126" x2="518" y2="126" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#ah)"/><rect x="16" y="204" width="724" height="58" rx="6" fill="#fff" stroke="#dcd8d1"/><text x="30" y="226" font-size="12" fill="#8a5a2b" text-anchor="start" font-weight="700" >最窄成立结论</text><text x="122" y="226" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >自动合成与表征可以连成现实闭环；物相鉴定、科学新颖性与最终裁决仍要严格复核。</text><text x="30" y="248" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="700" >读法</text><text x="72" y="248" font-size="11.5" fill="#6b6b6b" text-anchor="start" font-weight="400" >“新颖”原意是对预测平台而言的新目标，不必然是对科学界全新——一个词的范围，决定了整句话的强度。</text>
</svg>
