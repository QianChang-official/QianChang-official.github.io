<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" role="img" aria-label="图 3｜决策权深度 × 物理自动化">
<rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a5a2b"/></marker></defs><text x="0" y="24" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700" >图 3｜自主性不是一道门，是两个维度</text><text x="0" y="46" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400" >横轴＝决策权交到哪一环；纵轴＝物理执行是否自动化。两条轴几乎不相关。</text><line x1="60" y1="250" x2="720" y2="250" stroke="#1a1a1a" stroke-width="1.2"/><line x1="60" y1="250" x2="60" y2="80" stroke="#1a1a1a" stroke-width="1.2"/><line x1="90" y1="250" x2="90" y2="255" stroke="#6b6b6b"/><text x="90" y="272" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >Observe</text><line x1="235" y1="250" x2="235" y2="255" stroke="#6b6b6b"/><text x="235" y="272" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >Interpret</text><line x1="380" y1="250" x2="380" y2="255" stroke="#6b6b6b"/><text x="380" y="272" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >Revise</text><line x1="525" y1="250" x2="525" y2="255" stroke="#6b6b6b"/><text x="525" y="272" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >Select</text><line x1="670" y1="250" x2="670" y2="255" stroke="#6b6b6b"/><text x="670" y="272" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >Stop/Redirect</text><text x="390.0" y="292" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="600" >决策权深度 →</text><text x="52" y="86" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >机器人</text><text x="52" y="244" font-size="11" fill="#6b6b6b" text-anchor="end" font-weight="400" >纯计算</text><text x="52" y="165.0" font-size="11" fill="#1a1a1a" text-anchor="end" font-weight="600" transform="rotate(-90 52 165.0)">物理自动化</text><circle cx="235.0" cy="239.8" r="5" fill="#8a5a2b"/><text x="235.0" y="227.8" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >AlphaFold</text><circle cx="322.0" cy="239.8" r="5" fill="#8a5a2b"/><text x="322.0" y="227.8" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >GNoME</text><circle cx="452.5" cy="239.8" r="5" fill="#8a5a2b"/><text x="452.5" y="227.8" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >SR-Scientist</text><circle cx="525.0" cy="239.8" r="5" fill="#8a5a2b"/><text x="525.0" y="227.8" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >Kosmos</text><circle cx="655.5" cy="222.8" r="5" fill="#8a5a2b"/><text x="655.5" y="210.8" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >Co-Scientist</text><circle cx="561.25" cy="161.6" r="5" fill="#8a5a2b"/><text x="553.25" y="149.6" font-size="11.5" fill="#1a1a1a" text-anchor="end" font-weight="400" >Robin</text><circle cx="561.25" cy="93.6" r="5" fill="#8a5a2b"/><text x="561.25" y="81.6" font-size="11.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >A-Lab</text><line x1="561.25" y1="93.6" x2="561.25" y2="161.6" stroke="#dcd8d1" stroke-dasharray="4 4"/><text x="561.25" y="186" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400" >同一深度，物理自动化可以完全不同</text><text x="0" y="320" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" >所以问“有没有机械臂”判断不了自主性；要问的是：谁决定下一次实验做什么。</text>
</svg>
