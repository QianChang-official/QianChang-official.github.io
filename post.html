<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Qianchang 技术博客">
  <title>文章 - Qianchang</title>
  <link rel="icon" href="/img/fluid.png">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/markdown.css">
  <script src="/assets/js/app.js"></script>
</head>
<body>

  <div class="container page-layout">
    <article>
      <div id="post-meta-bar" class="post-meta-bar" style="display:none;"></div>
      <div id="post-content" class="md-content">加载中...</div>
      <div id="post-license" style="display:none;"></div>
    </article>

    <aside class="sidebar-toc">
      <div class="toc-title">目录</div>
      <div id="toc-content"></div>
    </aside>
  </div>

  <script>
    (async function () {
      const slug = window.QCApp.getParam('slug');
      if (!slug) { document.getElementById('post-content').innerHTML = '<p>缺少文章参数</p>'; return; }

      // Load post metadata
      const metaRes = await fetch('/content/posts.json');
      const metaData = await metaRes.json();
      const post = metaData.posts.find(p => p.slug === slug);

      // Render markdown
      await window.QCApp.renderMarkdown(
        document.getElementById('post-content'),
        '/content/posts/' + slug + '.md'
      );

      // Update title
      if (post) {
        document.title = post.title + ' - Qianchang';
        document.querySelector('meta[name="description"]').content = post.excerpt;

        const bar = document.getElementById('post-meta-bar');
        bar.style.display = 'flex';
        bar.innerHTML = `
          <span>${post.date}</span>
          <span>•</span>
          <span>${post.wordCount} 字 · ${post.readTime} 分钟</span>
          <span style="flex:1;"></span>
          ${post.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}
        `;

        // License
        document.getElementById('post-license').style.display = 'block';
        document.getElementById('post-license').innerHTML = `
          <div class="license-box">
            <div class="license-title">${post.title}</div>
            <div class="license-url">https://qianchanglys.top/post.html?slug=${post.slug}</div>
            <div class="license-meta">
              <div class="license-meta-item"><span>作者</span>Qianchang</div>
              <div class="license-meta-item"><span>发布于</span>${post.date}</div>
              <div class="license-meta-item"><span>许可</span>CC BY 4.0</div>
            </div>
          </div>
        `;
      }
    })();
  </script>

</body>
</html>
