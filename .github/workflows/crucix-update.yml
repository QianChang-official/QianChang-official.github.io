name: Update Crucix Data

on:
  schedule:
    - cron: '*/30 * * * *'  # 每 30 分钟
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: node scripts/crucix-fetch.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/crucix/data/
          git diff --staged --quiet || git commit -m "chore: update crucix data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
