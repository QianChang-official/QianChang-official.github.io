name: Update Crucix Data

on:
  schedule:
    # 每小时整点跑一次（GitHub Actions 对 */30 高频 schedule 不可靠）
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch data
        run: node scripts/crucix-fetch.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/crucix/data/
          git diff --staged --quiet || git commit -m "chore: update crucix data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      # GITHUB_TOKEN 触发的 push 不会触发其他工作流，需要显式触发部署
      - name: Trigger Pages deploy
        if: success()
        run: gh workflow run "Deploy to GitHub Pages"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
